services:
  redis:
    image: redis:7
    
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./ECommerceBackend
    depends_on:
      redis:
        condition: service_started
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LoggingSettings__Provider: File
      Jwt__Issuer: ECommerceBackend
      Jwt__Audience: ECommerceFrontend
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ECommerceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Redis__ConnectionString: "redis:6379,connectTimeout=2000,asyncTimeout=2000"
      Jwt__Key: ${JWT_KEY}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Razorpay__KeyId: ${RAZORPAY_KEY_ID}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET}
    volumes:
      - productimages:/app/wwwroot/images
      - bannerimages:/app/wwwroot/banners

  web:
    build:
      context: .
      dockerfile: Nginx/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Nginx/certs:/etc/nginx/certs:ro

volumes:
  sqldata:
  productimages:
  bannerimages: