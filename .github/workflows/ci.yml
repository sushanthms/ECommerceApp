
name: ECommerceApp CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ECommerceBackend/ECommerceBackend.csproj

      - name: Build backend
        run: dotnet build ECommerceBackend/ECommerceBackend.csproj --configuration Release --no-restore

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ECommerceFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ECommerceFrontend

      - name: Build frontend
        run: npm run build
        working-directory: ECommerceFrontend
